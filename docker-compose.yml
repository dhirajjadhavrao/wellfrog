version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wellfrog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wellfrog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - wellfrog_pgdata:/var/lib/postgresql/data

volumes:
  wellfrog_pgdata:
