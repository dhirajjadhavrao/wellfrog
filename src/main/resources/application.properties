spring.application.name=wellfrog
server.port=8080

# Database Configuration (Persistent H2 file database, zero manual setup required)
# Automatically creates and updates ./data/wellfrogdb.mv.db
spring.datasource.url=jdbc:h2:file:./data/wellfrogdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Configuration
wellfrog.jwt.secret=WellfrogSuperSecureSecretKeyForHMACSHA256EncryptionMustBeLongEnough123456789
wellfrog.jwt.expiration-ms=86400000

# Google OAuth2 Client ID (optional; override with GOOGLE_CLIENT_ID env var if set)
wellfrog.google.client-id=${GOOGLE_CLIENT_ID:}
