spring.application.name=wellfrog
server.port=8080

# PostgreSQL Database Configuration (Local & Server)
# Default connects to local PostgreSQL: jdbc:postgresql://localhost:5432/wellfrog
# On servers/cloud, pass SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wellfrog}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Hibernate / JPA for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
wellfrog.jwt.secret=${JWT_SECRET:WellfrogSuperSecureSecretKeyForHMACSHA256EncryptionMustBeLongEnough123456789}
wellfrog.jwt.expiration-ms=86400000

# Google OAuth2 Client ID (from Google Cloud Console)
wellfrog.google.client-id=${GOOGLE_CLIENT_ID:837467273232-18ba5gdh6f83gmsvlaadi1fug8tlouo7.apps.googleusercontent.com}
